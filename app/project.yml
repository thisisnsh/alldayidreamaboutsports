name: AllDayIDreamAboutSports
options:
  bundleIdPrefix: com.alldayidreamaboutsports
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  AllDayIDreamAboutSports:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: All Day I Dream About Sports
        PRODUCT_BUNDLE_IDENTIFIER: com.alldayidreamaboutsports.mac
        DEVELOPMENT_TEAM: 983LBM5U6B
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: 5.10
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        DEAD_CODE_STRIPPING: true
      configs:
        # Debug = fake services (no sign-in, no network, no API quota).
        # Release = real services. This is the "release flag":
        #   xcodebuild -configuration Debug|Release
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEV_BACKEND
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: All Day I Dream About Sports
        LSUIElement: true # menu bar only — never in the Dock, by design
        LSApplicationCategoryType: public.app-category.sports
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: © 2026 alldayidreamaboutsports.com
        # Google Sign-In (replace with the real iOS-type OAuth client id)
        GIDClientID: YOUR_CLIENT_ID.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.YOUR_CLIENT_ID
        # Sparkle (same key layout as aithing-mac)
        SUFeedURL: https://download.alldayidreamaboutsports.com/appcast.xml
        SUPublicEDKey: ghiXVL8NcRoV6i/FhLk/bHsoeC0afsLGzFMwHqhpQQ4=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: true # auto download + install by default; Settings can switch off
    entitlements:
      path: App.entitlements
      properties:
        com.apple.developer.aps-environment: production
        com.apple.security.app-sandbox: false

schemes:
  AllDayIDreamAboutSports:
    build:
      targets:
        AllDayIDreamAboutSports: all
    run:
      config: Debug
    archive:
      config: Release
