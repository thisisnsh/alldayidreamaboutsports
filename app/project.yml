name: AllDayIDreamAboutSports
options:
  bundleIdPrefix: com.alldayidreamaboutsports
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Staging: release
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  AllDayIDreamAboutSports:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        optional: true
        excludes:
          - "GoogleService-Info*.plist"
    dependencies:
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: All Day I Dream About Sports
        PRODUCT_BUNDLE_IDENTIFIER: com.alldayidreamaboutsports.mac
        DEVELOPMENT_TEAM: 983LBM5U6B
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: 5.10
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        DEAD_CODE_STRIPPING: true
      configs:
        # Debug = fake services (no sign-in, no network, no API quota).
        # Staging/Release = real services in their respective cloud projects.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEV_BACKEND
          GOOGLE_CLIENT_ID: UNUSED_IN_DEBUG
          GOOGLE_REVERSED_CLIENT_ID: UNUSED_IN_DEBUG
          APP_API_BASE_URL: https://unused.invalid
          APP_SCORES_BASE_URL: https://unused.invalid
          APP_FEED_URL: https://unused.invalid/appcast.xml
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
          CODE_SIGN_ENTITLEMENTS: App-Staging.entitlements
          GOOGLE_CLIENT_ID: 291291942072-cqsmesng18bagi6psv69n5ch4kcnvj2s.apps.googleusercontent.com
          GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.291291942072-cqsmesng18bagi6psv69n5ch4kcnvj2s
          GOOGLE_SERVICE_INFO_PLIST: GoogleService-Info-Staging.plist
          # Staging domains deliberately do not point at production.
          APP_API_BASE_URL: https://api-staging.alldayidreamaboutsports.com
          APP_SCORES_BASE_URL: https://scores-staging.alldayidreamaboutsports.com
          # Staging auto-updates from its own download bucket, never production's.
          APP_FEED_URL: https://download-staging.alldayidreamaboutsports.com/appcast.xml
        Release:
          CODE_SIGN_ENTITLEMENTS: App.entitlements
          GOOGLE_CLIENT_ID: 680190781802-t248eiqmjqaorv3ucok84t1ap9rrgc8q.apps.googleusercontent.com
          GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.680190781802-t248eiqmjqaorv3ucok84t1ap9rrgc8q
          GOOGLE_SERVICE_INFO_PLIST: GoogleService-Info-Production.plist
          APP_API_BASE_URL: https://api.alldayidreamaboutsports.com
          APP_SCORES_BASE_URL: https://scores.alldayidreamaboutsports.com
          APP_FEED_URL: https://download.alldayidreamaboutsports.com/appcast.xml
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: All Day I Dream About Sports
        LSUIElement: true # menu bar only — never in the Dock, by design
        LSApplicationCategoryType: public.app-category.sports
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: © 2026 alldayidreamaboutsports.com
        APIBaseURL: $(APP_API_BASE_URL)
        ScoresBaseURL: $(APP_SCORES_BASE_URL)
        # Google Sign-In. Values are selected by build configuration above.
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        # Sparkle (same key layout as aithing-mac). Feed URL is per-config so
        # staging updates from its own bucket; see APP_FEED_URL above.
        SUFeedURL: $(APP_FEED_URL)
        SUPublicEDKey: ghiXVL8NcRoV6i/FhLk/bHsoeC0afsLGzFMwHqhpQQ4=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: true # auto download + install by default; Settings can switch off
    postBuildScripts:
      - name: Select Firebase configuration
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            exit 0
          fi

          SOURCE="${SRCROOT}/Resources/${GOOGLE_SERVICE_INFO_PLIST}"
          DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ ! -f "$SOURCE" ]; then
            echo "error: Missing $SOURCE for ${CONFIGURATION}. See app/README.md."
            exit 1
          fi

          mkdir -p "$(dirname "$DESTINATION")"
          cp "$SOURCE" "$DESTINATION"

      # Crashlytics only symbolicates crashes if the dSYMs are uploaded at build
      # time. Runs after the plist copy above (Crashlytics reads the app id from
      # the bundled GoogleService-Info.plist). Debug has no Firebase, so skip it.
      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then exit 0; fi
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -f "$RUN" ]; then
            "$RUN"
          else
            echo "warning: Crashlytics run script not found at $RUN — skipping dSYM upload"
          fi

schemes:
  AllDayIDreamAboutSports:
    build:
      targets:
        AllDayIDreamAboutSports: all
    run:
      config: Debug
    profile:
      config: Staging
    archive:
      config: Release
