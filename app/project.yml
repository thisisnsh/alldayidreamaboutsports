name: AllDayIDreamAboutSports
options:
  bundleIdPrefix: com.alldayidreamaboutsports
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Staging: release
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

# Two targets share everything in this template and differ only in how they
# are signed, sandboxed and updated:
#   AllDayIDreamAboutSports           Developer ID DMG from the website (Sparkle)
#   AllDayIDreamAboutSports-AppStore  Mac App Store (sandboxed, no Sparkle)
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        optional: true
        excludes:
          - "GoogleService-Info*.plist"
    dependencies:
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_NAME: All Day I Dream About Sports
        PRODUCT_BUNDLE_IDENTIFIER: com.alldayidreamaboutsports.mac
        DEVELOPMENT_TEAM: 983LBM5U6B
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: 5.10
        DEAD_CODE_STRIPPING: true
      configs:
        # Debug = fake services (no sign-in, no network, no API quota).
        # Staging/Release = real services in their respective cloud projects.
        Debug:
          GOOGLE_CLIENT_ID: UNUSED_IN_DEBUG
          GOOGLE_REVERSED_CLIENT_ID: UNUSED_IN_DEBUG
          APP_API_BASE_URL: https://unused.invalid
          # The ONE real read a Debug build makes: catalog.json, so the picker
          # shows the current leagues and squads instead of a hand-maintained
          # list (FakeScores.fetchCatalog; everything else stays faked). It's a
          # public, CDN-cached, read-only file — no auth, no API quota. Point it
          # at production because staging's scores domain is access-protected.
          APP_SCORES_BASE_URL: https://scores.alldayidreamaboutsports.com
          APP_FEED_URL: https://unused.invalid/appcast.xml
        Staging:
          GOOGLE_CLIENT_ID: 291291942072-cqsmesng18bagi6psv69n5ch4kcnvj2s.apps.googleusercontent.com
          GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.291291942072-cqsmesng18bagi6psv69n5ch4kcnvj2s
          GOOGLE_SERVICE_INFO_PLIST: GoogleService-Info-Staging.plist
          # Staging domains deliberately do not point at production.
          APP_API_BASE_URL: https://api-staging.alldayidreamaboutsports.com
          APP_SCORES_BASE_URL: https://scores-staging.alldayidreamaboutsports.com
          # Staging auto-updates from its own download bucket, never production's.
          APP_FEED_URL: https://download-staging.alldayidreamaboutsports.com/appcast.xml
        Release:
          GOOGLE_CLIENT_ID: 680190781802-t248eiqmjqaorv3ucok84t1ap9rrgc8q.apps.googleusercontent.com
          GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.680190781802-t248eiqmjqaorv3ucok84t1ap9rrgc8q
          GOOGLE_SERVICE_INFO_PLIST: GoogleService-Info-Production.plist
          APP_API_BASE_URL: https://api.alldayidreamaboutsports.com
          APP_SCORES_BASE_URL: https://scores.alldayidreamaboutsports.com
          APP_FEED_URL: https://download.alldayidreamaboutsports.com/appcast.xml
    info:
      properties:
        CFBundleDisplayName: All Day I Dream About Sports
        # Reference the build settings (not literals) so MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION overrides flow through to the bundle.
        # Otherwise XcodeGen bakes in "1.0" / "1".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true # menu bar only — never in the Dock, by design
        LSApplicationCategoryType: public.app-category.sports
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: © 2026 alldayidreamaboutsports.com
        APIBaseURL: $(APP_API_BASE_URL)
        ScoresBaseURL: $(APP_SCORES_BASE_URL)
        # Google Sign-In. Values are selected by build configuration above.
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    postBuildScripts:
      - name: Select Firebase configuration
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            exit 0
          fi

          SOURCE="${SRCROOT}/Resources/${GOOGLE_SERVICE_INFO_PLIST}"
          DESTINATION="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ ! -f "$SOURCE" ]; then
            echo "error: Missing $SOURCE for ${CONFIGURATION}. See app/README.md."
            exit 1
          fi

          mkdir -p "$(dirname "$DESTINATION")"
          cp "$SOURCE" "$DESTINATION"

      # Crashlytics only symbolicates crashes if the dSYMs are uploaded at build
      # time. Runs after the plist copy above (Crashlytics reads the app id from
      # the bundled GoogleService-Info.plist). Debug has no Firebase, so skip it.
      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then exit 0; fi
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -f "$RUN" ]; then
            "$RUN"
          else
            echo "warning: Crashlytics run script not found at $RUN — skipping dSYM upload"
          fi

targets:
  AllDayIDreamAboutSports:
    templates: [App]
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEV_BACKEND
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
          CODE_SIGN_ENTITLEMENTS: App-Staging.entitlements
          # Manual Developer ID signing keeps the keychain ACL stable across
          # rebuilds. Firebase uses the data-protection keychain, so the
          # keychain-access-groups entitlement must be authorized by this
          # Developer ID provisioning profile.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: 983LBM5U6B.com.alldayidreamaboutsports.mac.3
        Release:
          # Manual Developer ID signing — see the Staging note above. This also
          # matches the archive/CI overrides (app-release.yml), so local Release
          # builds, CI, and the shipped app all share one stable designated
          # requirement.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: 983LBM5U6B.com.alldayidreamaboutsports.mac.3
    info:
      path: Info.plist
      properties:
        # Sparkle (same key layout as aithing-mac). Feed URL is per-config so
        # staging updates from its own bucket; see APP_FEED_URL above.
        SUFeedURL: $(APP_FEED_URL)
        SUPublicEDKey: ghiXVL8NcRoV6i/FhLk/bHsoeC0afsLGzFMwHqhpQQ4=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        # No silent install: a staged one blocks later feed checks until it lands.
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false

  # Mac App Store build. Same bundle id, Firebase apps and OAuth clients as the
  # DMG; App Store Connect handles distribution and updates, so Sparkle is not
  # linked at all (its Autoupdate helper would fail App Store validation).
  # Xcode manages signing: Apple Development to run, Apple Distribution when
  # you Product → Archive → Distribute App → App Store Connect.
  AllDayIDreamAboutSports-AppStore:
    templates: [App]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AppStore.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEV_BACKEND APP_STORE
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING APP_STORE
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
    info:
      path: Info-AppStore.plist
      properties:
        # HTTPS only — exempt, so App Store Connect skips the export
        # compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false

schemes:
  AllDayIDreamAboutSports:
    build:
      targets:
        AllDayIDreamAboutSports: all
    run:
      config: Debug
    profile:
      config: Staging
    archive:
      config: Release

  AllDayIDreamAboutSports-AppStore:
    build:
      targets:
        AllDayIDreamAboutSports-AppStore: all
    # Run the real production services so ⌘R exercises the sandbox exactly as
    # App Review will (sign-in, keychain, network).
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
