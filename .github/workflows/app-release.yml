name: app-release

# Tag v1.2.3.45 → code-signed, notarized, stapled, styled DMG uploaded as a workflow
# artifact. Sparkle appcast/delta generation and the R2 upload happen locally
# (see app/scripts/publish.sh) — not in CI.
# Tag format is <major>.<minor>.<patch>.<build>: the first three components are
# the marketing version, the fourth is the build number used by the Remote
# Config min_build force-update gate.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  APP_NAME: All Day I Dream About Sports
  SCHEME: AllDayIDreamAboutSports

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen + create-dmg
        run: brew install xcodegen create-dmg

      - name: Restore Firebase config
        env:
          FIREBASE_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PRODUCTION_PLIST_B64 }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_PRODUCTION_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_PRODUCTION_REVERSED_CLIENT_ID }}
        run: |
          test -n "$FIREBASE_PLIST_B64"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_REVERSED_CLIENT_ID"
          mkdir -p app/Resources
          printf '%s' "$FIREBASE_PLIST_B64" | base64 --decode > app/Resources/GoogleService-Info-Production.plist
          plutil -lint app/Resources/GoogleService-Info-Production.plist

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen

      - name: Import Developer ID certificate
        env:
          CERT_P12_B64: ${{ secrets.MACOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12_B64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm cert.p12

      - name: Build and archive
        working-directory: app
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must be v<major>.<minor>.<patch>.<build>, e.g. v1.2.3.45"
            exit 1
          fi
          VERSION="${TAG%.*}"
          BUILD="${TAG##*.}"
          xcodebuild archive \
            -project AllDayIDreamAboutSports.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_OAUTH_PRODUCTION_CLIENT_ID }}" \
            GOOGLE_REVERSED_CLIENT_ID="${{ secrets.GOOGLE_OAUTH_PRODUCTION_REVERSED_CLIENT_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Developer ID Application"

      - name: Export app
        working-directory: app
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Notarize and staple
        working-directory: app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/export/${APP_NAME}.app"
          ditto -c -k --keepParent "$APP" build/notarize.zip
          xcrun notarytool submit build/notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"

      - name: Package as styled DMG (signed, notarized, stapled)
        working-directory: app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${TAG%.*}"
          DMG="AllDayIDreamAboutSports-${VERSION}.dmg"
          mkdir -p build/dist build/dmgsrc
          cp -R "build/export/${APP_NAME}.app" build/dmgsrc/
          create-dmg \
            --volname "$APP_NAME" \
            --background "../assets/dmg-background.png" \
            --window-size 660 400 --icon-size 128 \
            --icon "${APP_NAME}.app" 180 170 \
            --app-drop-link 480 170 \
            "build/dist/$DMG" "build/dmgsrc"
          codesign --sign "Developer ID Application" --timestamp "build/dist/$DMG"
          xcrun notarytool submit "build/dist/$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "build/dist/$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllDayIDreamAboutSports-dmg
          path: app/build/dist/*.dmg
          if-no-files-found: error
