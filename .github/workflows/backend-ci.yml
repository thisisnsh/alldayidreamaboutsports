name: backend-ci

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tester/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm run typecheck && npm test && npm run build && npm audit --audit-level=low
        working-directory: backend
      - run: npm ci --ignore-scripts && npm run typecheck && npm audit --audit-level=low
        working-directory: tester
      - run: python3 -m unittest discover -s infra/test -v
