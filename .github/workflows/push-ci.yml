name: push-ci
on:
  pull_request:
    paths: ['push/**', '.github/workflows/push-ci.yml']
  push:
    branches: [main]
    paths: ['push/**', '.github/workflows/push-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: push
      - run: npm run typecheck && npm test && npm run build && npm audit --omit=dev --audit-level=low
        working-directory: push
      - run: bash -n push/infra/deploy.sh
