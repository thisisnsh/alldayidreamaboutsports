name: web-deploy

# Deploys web/ to GitHub Pages on every push to main that touches it.
# One-time repo setting required: Settings → Pages → Source = "GitHub Actions".
# Custom domain comes from web/CNAME (alldayidreamaboutsports.com).

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
