name: backend-deploy

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-deploy.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, prod]
        default: staging

concurrency: backend-deploy-${{ inputs.environment || 'staging' }}

permissions:
  contents: read
  id-token: write # Workload Identity Federation — no JSON keys in secrets

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      # Per-environment GitHub environment variables:
      #   GCP_PROJECT_ID  e.g. dreamaboutsports-staging / dreamaboutsports-prod
      #   GCP_REGION      e.g. us-central1
      SERVICE: alldayidreamaboutsports-backend
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Validate environment configuration
        run: test -n "${{ vars.R2_BUCKET_SCORES }}"

      - name: Deploy to Cloud Run
        run: |
          if [[ "${{ vars.GCP_PROJECT_ID }}" == *staging* ]]; then
            SCORES_DOMAIN="https://scores-staging.alldayidreamaboutsports.com"
          else
            SCORES_DOMAIN="https://scores.alldayidreamaboutsports.com"
          fi
          # Premier League, La Liga, Serie A, Bundesliga, Ligue 1. Seasons are
          # NOT set here — they resolve per-league from catalog.json, so the
          # August rollover needs no deploy. Override per environment with the
          # LEAGUE_IDS GitHub variable.
          LEAGUE_IDS="${{ vars.LEAGUE_IDS || '39,140,135,78,61' }}"
          # NOTE: --update-env-vars splits entries on commas, so a value that
          # CONTAINS commas (LEAGUE_IDS) has to change the delimiter. The
          # leading ^##^ tells gcloud to split on ## instead; without it,
          # "LEAGUE_IDS=39,140,..." parses as LEAGUE_IDS=39 plus a bare "140"
          # and the deploy fails with "Bad syntax for dict arg: [140]".
          gcloud run deploy "$SERVICE" \
            --source backend \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "sports-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max 50 \
            --max-instances 50 \
            --memory 512Mi \
            --cpu 1 \
            --update-env-vars "^##^GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}##R2_BUCKET_SCORES=${{ vars.R2_BUCKET_SCORES }}##TASKS_QUEUE=live-scores##TASKS_LOCATION=${{ vars.GCP_REGION }}##SCORES_DOMAIN=${SCORES_DOMAIN}##LEAGUE_IDS=${LEAGUE_IDS}" \
            --set-secrets "API_FOOTBALL_KEY=api-football-key:latest,SESSION_JWT_SECRET=session-jwt-secret:latest,R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,R2_ENDPOINT=r2-endpoint:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "Smoke testing $URL/healthz/"
          curl -fsS "$URL/healthz/"
