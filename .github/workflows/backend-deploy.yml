name: backend-deploy

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/*.sh", ".github/workflows/backend-deploy.yml", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, prod]
        default: staging

concurrency: backend-deploy-${{ inputs.environment || 'staging' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/backend-ci.yml
  deploy:
    needs: verify
    permissions:
      contents: read
      id-token: write # Granted only after this commit passes verification.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      # Per-environment GitHub environment variables:
      #   GCP_PROJECT_ID  e.g. dreamaboutsports-staging / dreamaboutsports-prod
      #   GCP_REGION      e.g. us-central1
      SERVICE: alldayidreamaboutsports-backend
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      R2_BUCKET_SCORES: ${{ vars.R2_BUCKET_SCORES }}
      LEAGUE_IDS: ${{ vars.LEAGUE_IDS || '39,140,135,78,61' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Validate environment configuration
        run: test -n "${R2_BUCKET_SCORES}"

      - name: Resolve service audience before startup
        id: audience
        run: |
          if ! URL=$(gcloud run services describe "$SERVICE" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format 'value(status.url)' 2>/dev/null); then
            PROJECT_NUMBER=$(gcloud projects describe "${GCP_PROJECT_ID}" --format 'value(projectNumber)')
            URL="https://${SERVICE}-${PROJECT_NUMBER}.${GCP_REGION}.run.app"
          fi
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        env:
          SERVICE_URL: ${{ steps.audience.outputs.url }}
        run: |
          if [[ "${GCP_PROJECT_ID}" == *staging* ]]; then
            SCORES_DOMAIN="https://scores-staging.alldayidreamaboutsports.com"
          else
            SCORES_DOMAIN="https://scores.alldayidreamaboutsports.com"
          fi
          # Premier League, La Liga, Serie A, Bundesliga, Ligue 1. Seasons are
          # NOT set here — they resolve per-league from catalog.json, so the
          # August rollover needs no deploy. Override per environment with the
          # LEAGUE_IDS GitHub variable.
          # NOTE: --update-env-vars splits entries on commas, so a value that
          # CONTAINS commas (LEAGUE_IDS) has to change the delimiter. The
          # leading ^##^ tells gcloud to split on ## instead; without it,
          # "LEAGUE_IDS=39,140,..." parses as LEAGUE_IDS=39 plus a bare "140"
          # and the deploy fails with "Bad syntax for dict arg: [140]".
          gcloud run deploy "$SERVICE" \
            --source backend \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --service-account "sports-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --invoker-iam-check \
            --min-instances 0 \
            --max 50 \
            --max-instances 50 \
            --memory 512Mi \
            --cpu 1 \
            --update-env-vars "^##^GCP_PROJECT_ID=${GCP_PROJECT_ID}##SERVICE_URL=${SERVICE_URL}##R2_BUCKET_SCORES=${R2_BUCKET_SCORES}##TASKS_QUEUE=live-scores##TASKS_LOCATION=${GCP_REGION}##SCORES_DOMAIN=${SCORES_DOMAIN}##LEAGUE_IDS=${LEAGUE_IDS}" \
            --set-secrets "API_FOOTBALL_KEY=api-football-key:latest,R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,R2_ENDPOINT=r2-endpoint:latest"

      - name: Restrict invocation and resolve service URL
        id: service
        run: |
          bash infra/secure-backend.sh "${GCP_PROJECT_ID}" "${GCP_REGION}"
          URL=$(gcloud run services describe "$SERVICE" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format 'value(status.url)')
          gcloud run services update "$SERVICE" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --update-env-vars "SERVICE_URL=$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Authenticate health check
        id: health-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Smoke test authenticated health
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
          ID_TOKEN: ${{ steps.health-auth.outputs.id_token }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/internal/healthz"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$SERVICE_URL/internal/healthz")
          test "$STATUS" = 403 || test "$STATUS" = 401
