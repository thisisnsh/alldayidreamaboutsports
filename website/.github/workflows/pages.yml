# Builds the site with 11ty and publishes it to GitHub Pages.
#
# This needs Pages set to "GitHub Actions" as its source (Settings → Pages →
# Build and deployment → Source). Until that is flipped, this workflow builds
# and uploads fine but the live site still serves the old branch root.
#
# The build is offline on purpose: src/_data/leagues.json, teams.json and the
# crests are generated by scripts/build-data.mjs and committed, so a build here
# never depends on the catalog being up and is always reproducible.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx @11ty/eleventy

      - name: Verify the build
        run: node scripts/verify-build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
